<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · JKSpeak</title>
<link rel="icon" href="./jkspeak-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./auth.css">
<style>
  .hero{position:relative;overflow:hidden;background:var(--hair);border-radius:30px;
    height:min(48vh,380px);display:grid;place-items:center}
  .hero .avatar-wrap{width:min(170px,45vw)}
  .text{padding:24px 10px 0}
  .tagline{margin:6px 0 10px}
  .lead{margin-bottom:28px}
</style>
</head>
<body class="app" data-auth-page="welcome">
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="screen">
  <div class="hero" aria-hidden="true">
    <svg class="scenery" viewBox="0 0 480 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g fill="#ffa26e">
        <circle cx="60" cy="150" r="60"/><circle cx="130" cy="130" r="55"/><circle cx="190" cy="160" r="45"/><rect x="0" y="150" width="235" height="55" rx="27"/>
        <circle cx="300" cy="80" r="50"/><circle cx="360" cy="55" r="60"/><circle cx="430" cy="85" r="48"/><rect x="250" y="80" width="230" height="52" rx="26"/>
      </g>
      <path d="M-20 330 Q240 410 500 330" stroke="#ffd2b6" stroke-width="2" fill="none"/>
      <g fill="#fff">
        <path class="twinkle" d="M70 260l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
        <path class="twinkle" d="M250 190l7 19 19 7-19 7-7 19-7-19-19-7 19-7z"/>
        <path class="twinkle" d="M410 250l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
        <path class="twinkle" d="M40 40l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
        <path class="twinkle" d="M440 420l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
      </g>
    </svg>
    <div class="avatar-wrap">
      <img class="avatar" src="./avatar.png" alt="">
      <p class="bubble">Welcome!</p>
    </div>
  </div>
  <section class="text" aria-labelledby="app-title">
    <h1 id="app-title" class="title">JKSpeak</h1>
    <p class="tagline">Your oral exam practice companion</p>
    <p class="lead muted">New here? Set up your learning profile. Already have an account? Log in and continue your practice.</p>
    <div class="stack">
      <a class="btn btn-primary" href="login.html">Log in</a>
      <a class="btn" href="./signup.html">Create an account</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module" src="./auth-pages.mjs"></script>
</body>
</html>
